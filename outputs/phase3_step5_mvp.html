<script>
"use strict";
// Venture OS MVP. Everything stays on this device (localStorage). No network calls, no real payments.
const C = JSON.parse(document.getElementById("config").textContent);
const T = C.texts;
const KEY = "mvp_" + C.brief_id + "_";
const load = (k) => { try { return JSON.parse(localStorage.getItem(KEY + k) || "[]"); } catch (e) { return []; } };
const save = (k, v) => { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) { /* storage off */ } };
const el = (tag, attrs, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);

  for (const k of kids.flat(Infinity)) n.append(k instanceof Node ? k : document.createTextNode(String(k ?? "")));

};
const nums = C.fields.filter(f => f.type === "number");
const minField = nums.find(f => /min|حد|أدنى|ادنى/i.test(f.label));
const qtyField = nums.find(f => f !== minField);

document.getElementById("title").textContent = C.title;
document.getElementById("tagline").textContent = C.tagline;
document.getElementById("banner").textContent = T.banner;
document.getElementById("footer").textContent = T.footer + " · Brief " + C.brief_id + " v" + C.brief_version;

function fieldInput(f, prefix) {
  const id = prefix + f.id;
  let input;
  if (f.type === "select") input = el("select", {id, name: f.id}, el("option", {value: ""}, "—"), f.options.map(o => el("option", {value: o}, o)));
  else if (f.type === "textarea") input = el("textarea", {id, name: f.id, rows: "3"});
  else if (f.type === "checkbox") input = el("input", {id, name: f.id, type: "checkbox"});
  else input = el("input", {id, name: f.id, type: f.type === "number" ? "number" : f.type, step: f.type === "number" ? "any" : null});
  if (f.required && f.type !== "checkbox") input.required = true;
  return [el("label", {for: id}, f.label + (f.required ? " *" : "") + (f.mocked ? " (MOCKED)" : "")), input];
}

function readForm(form, fields) {
  const rec = {};
  for (const f of fields) {
    const i = form.elements[f.id];
    rec[f.id] = f.type === "checkbox" ? i.checked : i.value;
  }
  return rec;
}

function describe(rec, fields) {
  return fields.filter(f => rec[f.id] !== "" && rec[f.id] !== false && rec[f.id] !== undefined)
    .map(f => f.label + ": " + (rec[f.id] === true ? "✓" : rec[f.id])).join(" · ");
}

function listCard(k, rec, fields, onRemove, extra) {
  return el("div", {class: "card row", "data-record": ""},
    el("div", {}, el("div", {}, describe(rec, fields)), el("div", {class: "muted"}, rec._at || ""), extra || ""),
    el("button", {class: "small", type: "button", on: {click: onRemove}}, T.remove));
}

const providerFields = [
  {id: "p1", label: T.provider_name, type: "text", required: true},
  {id: "p2", label: T.provider_offer, type: "text", required: true},
  {id: "p3", label: T.provider_area, type: "text", required: false},
];

// Fills {f1}-style slots with what the customer typed (text only, never HTML).
const fill = (line, vals) => String(line).replace(/\{(f\d+)\}/g, (m, id) => vals[id] || "…");
function sampleText(vals) {
  const S = C.spec;
  return [fill(S.sample_title, vals), ""].concat(S.sample_lines.map(l => fill(l, vals))).join("\n");
}
function downloadSample(vals) {
  try {
    const blob = new Blob([sampleText(vals) + "\n\n" + T.banner + "\n"], {type: "text/plain;charset=utf-8"});
    const a = el("a", {href: URL.createObjectURL(blob), download: "sample-" + C.brief_id.slice(0, 8) + ".txt"});
    document.body.append(a); a.click(); a.remove();
  } catch (e) { /* downloads blocked: the preview stays on screen */ }
}

const BLOCKS = {
  hero(sec, S) {
    sec.append(el("div", {class: "card", "data-block": "hero"}, el("h2", {}, S.sample_title),
      el("p", {}, C.tagline)));
  },
  offers(sec, S) {
    sec.append(el("h3", {}, T.offers));
    S.offers.forEach((o, i) => {
      const status = el("p", {class: "muted", "data-order-status": ""});
      const deliver = el("button", {class: "small", type: "button", hidden: "", "data-action": "deliver", on: {click: () => downloadSample(lastVals)}}, T.deliver);
      sec.append(el("div", {class: "card", "data-block": "offer"},

      el("button", {class: "small", type: "button", "data-action": "print", on: {click: () => window.print()}}, T.print), " ",
      el("button", {class: "small", type: "button", "data-action": "download", on: {click: () => downloadSample(lastVals)}}, T.download));

      save("waitlist", w); form.reset(); msg.textContent = T.joined; });
    sec.append(form);
  },

    if (!S.faq.length) return;
    sec.append(el("h3", {}, T.faq));
    S.faq.forEach(([q, a]) => sec.append(el("details", {class: "card", "data-block": "faq"}, el("summary", {}, q), el("p", {}, a))));
  },
};
let lastVals = {};

const SCREENS = {
  product(sec) {  // block order comes from the product spec
    const S = C.spec;
    S.blocks.filter(b => BLOCKS[b]).forEach(b => BLOCKS[b](sec, S));
  },
  add(sec) {
    const fields = C.fields.slice();
    const providers = load("providers");
    if (C.template === "booking") fields.unshift({id: "_provider", label: T.provider_pick, type: "select", required: false,
      options: providers.map(p => p.p1 + " — " + p.p2)});
    const form = el("form", {"data-requirements": (C.screen_requirements.add || []).join(" ")},

      const items = load("items"); items.push(rec); save("items", items);
      form.reset(); show(C.template === "calculator" ? "home" : "list");
    });
    sec.append(form);
  },
  list(sec) {
    if (C.template === "calculator") return SCREENS.saved(sec);
    const items = load("items");

    if (!items.length) sec.append(el("p", {class: "muted"}, T.empty));

  },

      el("div", {class: "result"}, T.result + ": " + rec._result))));
  },
  providers(sec) {

      el("p", {class: "help"}, T.provider_help), providerFields.map(f => fieldInput(f, "p_")),
      el("button", {class: "primary", type: "submit"}, T.provider_join));

        const vals = nums.map(f => parseFloat(form.elements[f.id].value)).filter(v => !isNaN(v));
        return vals.length ? vals.reduce((a, b) => a * b, 1) : null;
      };
      form.addEventListener("input", () => { const r = compute(); form.querySelector("#calc-result").textContent = T.result + ": " + (r === null ? "—" : r.toLocaleString()); });
      form.addEventListener("submit", (e) => {
        e.preventDefault(); const r = compute(); if (r === null) return;
        const rec = readForm(form, C.fields); rec._result = r.toLocaleString(); rec._at = new Date().toLocaleString();
        const rs = load("results"); rs.push(rec); save("results", rs); show("list");
      });
      return sec.append(form);
    }
    if (C.template === "tracker") {
      const low = items.filter(r => qtyField && minField && r[minField.id] !== "" && parseFloat(r[qtyField.id]) < parseFloat(r[minField.id]));
      sec.append(el("div", {class: "stats", "data-requirements": req},

        el("div", {class: "stat"}, el("b", {class: low.length ? "low" : ""}, low.length), T.below_min)));
      low.forEach(r => sec.append(el("div", {class: "card low"}, describe(r, C.fields))));
      return;
    }
    if (C.template === "booking") {
      const ps = load("providers");
      sec.append(el("div", {"data-requirements": req}));
      if (!ps.length) sec.append(el("p", {class: "muted"}, T.no_providers));
      ps.forEach(p => sec.append(el("div", {class: "card"}, el("b", {}, p.p1), el("div", {}, p.p2), el("div", {class: "muted"}, p.p3 || ""))));

    const q = el("input", {type: "search", placeholder: T.search, "aria-label": T.search, "data-requirements": req});
    const box = el("div");
    const draw = () => {
      box.replaceChildren();

      if (!hits.length) box.append(el("p", {class: "muted"}, T.empty));
      hits.forEach(r => box.append(el("div", {class: "card"}, describe(r, C.fields))));

const nav = document.getElementById("nav"), main = document.getElementById("main");
