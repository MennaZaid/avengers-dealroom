# Local web search for the research and benchmark agents (free, no API key).
# Start it with:  docker compose -p dealroom up -d searxng
services:
  searxng:
    image: searxng/searxng:2026.11.13-219b63b20
    ports: ["${SEARXNG_PORT:-8080}:8080"]
    volumes: ["./config/searxng:/etc/searxng"]
    restart: unless-stopped
