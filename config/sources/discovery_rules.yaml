# Generated from source_registry_seed.xlsx tab 'discovery_rules' on 2026-11-16 by scripts/import_seed.py.
# Seed list written from memory and NOT yet verified: every URL and license is a claim to check.
- step: '1'
  name: Normalise the brief
  what the agent does: Map market to ISO country code and industry to ISIC section
  how it verifies: Confidence label set, ask one question if ambiguous
  output: Normalised brief
- step: '2'
  name: Find the statistics office
  what the agent does: 'Search: [country] national statistics office official'
  how it verifies: Domain is government or listed by the UN or World Bank, check against the Public Suffix List
  output: URL, tier A
- step: '3'
  name: Find the central bank
  what the agent does: 'Search: [country] central bank statistics'
  how it verifies: Same official-domain check
  output: URL, tier A
- step: '4'
  name: Find the company registry
  what the agent does: 'Search: [country] company registry business register'
  how it verifies: Official domain or listed by OpenCorporates
  output: URL, tier A or B
- step: '5'
  name: Find the industry regulator
  what the agent does: 'Search: [industry] regulator [country]'
  how it verifies: Official domain, record the law or license it enforces
  output: URL, tier A, legal flag
- step: '6'
  name: Find industry bodies
  what the agent does: 'Search: [industry] association [country]'
  how it verifies: Check membership, publication date, independence
  output: URL, tier B
- step: '7'
  name: Query global sources
  what the agent does: Call global registry rows with the country code
  how it verifies: Record HTTP status, date, license text
  output: Dataset or NONE FOUND
- step: '8'
  name: Find a real number
  what the agent does: Open the page and locate one citable figure
  how it verifies: Store the exact URL where the figure appears, not the home page
  output: Cited figure
- step: '9'
  name: Grade and date
  what the agent does: Assign tier, read the publication date, compare with max_age_months
  how it verifies: Mark STALE if older than max age
  output: Graded source
- step: '10'
  name: Score coverage
  what the agent does: Count graded, fresh sources per question area
  how it verifies: Strong, partial or thin
  output: Coverage score, triggers fallback spec if thin
- step: '11'
  name: Check crawl permission
  what the agent does: Read robots.txt and terms of use before crawling
  how it verifies: Skip and log if disallowed
  output: Crawl log
- step: '12'
  name: Log everything
  what the agent does: Write what was searched, found and not found
  how it verifies: Every miss is recorded
  output: Decision log entry
