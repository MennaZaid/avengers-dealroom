# Digital-product pack (registry_seed schema + Discover fields). The system builds digital products only.
# product_scope: digital | physical | any (the planner uses digital + any). access_type: api | search_only |
# polite_fetch | manual_upload | manual. Every row is verified: false; licences are UNVERIFIED until an admin
# checks them. scripts/check_sources.py tests test_url and records reachable / failed / needs_key.
