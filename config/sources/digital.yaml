- id: D-001
  scope: global
  source_name: Apple iTunes Search API (App Store listings)
  url: https://itunes.apple.com/search
  provides: App listings per country store - name, developer, genre, price, rating count; finds competitor apps
  access_type: api
  auth_needed: 'no'
  license: 'UNVERIFIED (believed: Apple terms of use)'
  coverage: per country store
  update_frequency: live
  max_age_months: 3
  tier: B
  crawl: full
  use: market
  notes: Query term + country + entity=software. Rating counts are a demand signal, not sales.
  url_status: OK
  http_status: 200
  tested_on: 2026-11-17
  limitations: Public, no key; Apple terms apply. Rating counts are demand signals, not sales.
  test_url: https://itunes.apple.com/search?term=invoice&entity=software&country=eg&limit=1
  product_scope: digital
  verified: false
