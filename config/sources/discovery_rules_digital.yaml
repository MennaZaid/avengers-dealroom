# Digital-product variants of the discovery rules (steps 1-12 are in discovery_rules.yaml and stay as they are).
# Same schema; product_scope says which product type a rule is for. Seeded into the discovery_rules table.
- step: '13'
  name: SaaS or web app - directories and code first
  what the agent does: 'Search app/plugin directories (Shopify App Store, WordPress.org plugins, Chrome Web Store) and GitHub for [problem] before news'
  how it verifies: Listing has a price or install/rating count and a live URL; GitHub repo has recent commits
  output: Competitors and open-source substitutes with price and URL
  product_scope: digital
- step: '14'
  name: Mobile app - store listings and reviews
  what the agent does: 'iTunes Search API for [problem] in the target country store; App Store review RSS for verbatim complaints; Google Play through search only'
  how it verifies: App id, country store and retrieval date recorded; review quotes are verbatim
  output: Competing apps (price, rating count) and review quotes
  product_scope: digital
- step: '15'
  name: Pain in public discussions
  what the agent does: 'Search Hacker News (Algolia API), Stack Exchange API and Reddit (via SearXNG) for [problem] [audience]; prefer posts describing past behaviour'
  how it verifies: Quote is verbatim with URL and date; Stack Exchange content attributed (CC BY-SA)
  output: Pain quotes typed fact with source
  product_scope: digital
- step: '16'
  name: Templates, courses and digital downloads - marketplace prices
  what the agent does: 'Search Gumroad, Etsy digital downloads, Notion template gallery, Udemy and Envato for [topic] [language]'
  how it verifies: Price and listing URL recorded; list price, not sales
  output: Price points proving people pay
  product_scope: digital
- step: '17'
  name: Developer tools - package and issue demand
  what the agent does: 'npm/PyPI download counts for related packages; GitHub issues with reactions mentioning [problem]'
  how it verifies: Package name and period recorded; downloads labelled as downloads, not users
  output: Demand signals for a developer tool
  product_scope: digital
- step: '18'
  name: Digital reach of the target country
  what the agent does: 'World Bank WDI IT.NET.USER.ZS, ITU DataHub, the national ICT regulator (e.g. MCIT/NTRA for Egypt) and DataReportal for [country]'
  how it verifies: Indicator, year and source recorded; older than the max age flagged stale
  output: Internet users and mobile broadband for bottom-up market sizing
  product_scope: any
- step: '19'
  name: Ability to pay online
  what the agent does: 'World Bank Global Findex (made or received a digital payment) and the central bank e-payment statistics for [country]'
  how it verifies: Indicator and survey year recorded; used only as a sizing input
  output: Share of the segment able to pay online
  product_scope: any
