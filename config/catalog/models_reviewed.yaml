- id: T-201
  kind: model
  name: openai/gpt-oss-120b
  url: https://huggingface.co/openai/gpt-oss-120b
  license: Apache 2.0 (stated on card)
  status: candidate
  use: Reasoning profile candidate
  notes: >-
    117B params, 5.1B active (MoE, MXFP4). Fits one 80GB GPU, so hosted only for us.
    Card states function calling, Structured Outputs, configurable reasoning effort.
    Must be used with the harmony response format. Context length and Arabic support not stated on card.
    Providers (Hugging Face page via OpenRouter, checked 2026-11-16; USD per 1M tokens input/output, tokens/s, 24h uptime):
    Prime Intellect 0.08/0.16 74 t/s 100%; CoreWeave 0.03/0.17 46 t/s 91.8%; DigitalOcean 0.06/0.42 62 t/s 100%;
    Baseten 0.10/0.50 163 t/s 99.3%; Nebius 0.15/0.60 278 t/s 100%; Together AI 0.15/0.60 89 t/s 98.3%;
    Cerebras 0.35/0.75 664 t/s 100%; Parasail 0.10/0.75 176 t/s 99.6%. Prices change: re-check before relying on them.
  verified_on: 2026-11-16
