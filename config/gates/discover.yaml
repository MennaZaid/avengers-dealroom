# Discover gate: thresholds and scoring weights, set BEFORE any research runs. The orchestrator writes these
# values to decision_log.json (action "set_gate_thresholds") at the start of every run, so the result cannot
# move the goalposts. Change them here, never during a run.

thresholds:
  problem_fact_claims: 5          # fact claims about the problem (pain), within freshness limits ...
  problem_source_domains: 3       # ... from at least this many distinct source domains
  priced_competitors: 2           # competitors/substitutes with a sourced price (proof people pay)
  top_idea_score: 3.0             # best idea's weighted score, out of 5
  fit_criterion_min: 2            # every "fit" criterion of that idea at least this
  interviews: 5                   # founder-entered Mom Test interviews ...
  interviews_past_behaviour: 3    # ... of which describe the problem from past behaviour
  relevant_pages: 3               # pain pages that pass the relevance filter below (0 -> stop)

relevance:                        # before claim extraction: bge-m3 cosine similarity of each pain page to the
  min_similarity: 0.35            # pain statement (customer + problem); pages under this are dropped and logged

freshness_months:                 # claims older than this are stale and don't count
  pain: 36
  competitor_price: 18
  market_size: 36
  default: 36

scoring:
  scale: [1, 5]
  unevidenced_cap: 3              # a score with no evidence ids is capped here and marked ASSUMPTION
  weights:                        # sum = 1.0
    pain_evidence: 0.20           # evidence of pain (quotes from real people)
    people_pay: 0.15              # sourced competitor prices
    competition: 0.10             # 5 = room to differentiate, 1 = saturated with strong free alternatives
    skill_fit: 0.15
    budget_fit: 0.10
    time_fit: 0.10                # MVP within the stated hours
    values_fit: 0.05
    digital_deliverability: 0.05
    reachable_market: 0.10
  fit_criteria: [skill_fit, budget_fit, time_fit, values_fit]

stop_rules:
  min_problem_claims_to_continue: 1   # zero sourced pain evidence -> stop
  saturated_competitors: 8            # this many free alternatives found and nothing differentiates -> stop
