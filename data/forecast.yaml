# Year-5 forecast inputs. Everything marked ASSUMPTION is the team's estimate: change it after discussion.
# round_usd: total the startup is raising now. monthly_burn_usd: what the company spends per month.
# y5_base / y5_downside: what the whole company is worth in 5 years (USD) in each case. 0 = the company fails.
dilution:
  base_keep: 0.66      # SOURCE Carta Q2 2026 medians: seed 19.4%, Series A 18.7% dilution -> 0.806 x 0.813 = 0.655 (carta.com/learn/startups/fundraising)
  downside_keep: 0.50  # ASSUMPTION: a third round or a down-round on top of the Carta medians -> we keep about half
