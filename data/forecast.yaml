  round_usd: 400000            # DECK: "$400K Round size"
  monthly_burn_usd: 19000      # MODEL: 2027 free cash flow -USD 230K / 12 months
  milestone: "GCC expansion and AI modules (DECK use of funds: 60% product, 30% sales, 10% opex); aim ~$300K ARR for a seed round"
  y5_base: 25000000            # MODEL 2031 exit ARR USD 4.6M, haircut to ~$3M (ASSUMPTION) x 8x = top of vertical B2B SaaS 4-8x ARR (l40.com/insights/saas-multiples, 2026)
  y5_downside: 3000000         # ASSUMPTION: stalls near $0.5M ARR x 6x
