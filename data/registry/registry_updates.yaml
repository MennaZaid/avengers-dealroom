# Changes to registry rows that came from the team workbook (registry_seed.yaml is generated; don't edit it).
# db/seed.py applies each entry through registry.update_source, the logged admin path: before/after and the
# reason go to source_changes. A row an admin has edited by hand is never overwritten by this file.
# Fields: product_scope (digital | physical | any; default any), access_type (api | search_only | polite_fetch |
# manual_upload | manual), limitations, test_url (checked by scripts/check_sources.py), industries (ISIC
# sections the source is limited to; Discover uses a scoped source only for ideas in that sector), notes.

