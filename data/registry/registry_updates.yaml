# ---------- digital-market sizing (spec section 4) ----------
R-001:
  product_scope: any
  access_type: api
  test_url: https://api.worldbank.org/v2/country/EG/indicator/IT.NET.USER.ZS?format=json&mrv=1
  limitations: "WDI indicator IT.NET.USER.ZS (internet users, % of population) for digital reach; annual, lags 1-2 years."
  reason: "Discover spec: add the internet-users indicator used for digital market sizing"
R-004:
  product_scope: any
  industries: []
  test_url: https://www.worldbank.org/en/publication/globalfindex
  limitations: "Share of adults paying online = ability to pay digitally. Data only; not a financial product. Survey every 3 years."
  reason: "Discover spec: Findex is ability-to-pay data for any digital product, not finance-only"
R-018:
  product_scope: any
  access_type: polite_fetch
  test_url: https://datahub.itu.int/
  limitations: "Internet use and mobile broadband by country; country series lag 1-2 years."
  reason: "Discover spec: ITU DataHub is the digital-reach source for market sizing"
EG-002:
  product_scope: any
  access_type: manual_upload
  test_url: https://www.cbe.org.eg/
  limitations: "E-payment statistics only (ability to pay online); not used for financial products. Portal download."
  reason: "Discover spec: CBE e-payment statistics for digital ability-to-pay"
R-054:
  product_scope: any
  access_type: polite_fetch
  test_url: https://datareportal.com/reports/digital-2026-egypt
  limitations: "Kepios 'Digital 2026: Egypt' report; tier B; licence to be checked before quoting figures beyond short citations."
  reason: "Discover spec: DataReportal Digital 2026 Egypt for digital market sizing"
R-055:
  product_scope: any
  access_type: manual_upload
  limitations: "GSMA Mobile Economy MENA/Africa reports: free with registration; download by hand."
  reason: "Discover spec: GSMA reports need registration, so manual upload"
R-060:
  product_scope: any
  access_type: manual_upload
  limitations: "No stable free API; pytrends is unofficial scraping and is not used. Upload CSV exports by hand. Relative index, not volume."
  reason: "Discover spec: Google Trends only through manual CSV export"

# ---------- demand and pain signals (UGC, tier C, short freshness) ----------
R-061: {product_scope: digital, reason: "Developer survey: only relevant to digital products for developers"}
R-066:
  product_scope: any
  limitations: "Article text; pageviews are in D-021."
  reason: "Discover spec: Wikimedia is interest data for any product"
