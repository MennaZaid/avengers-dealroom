<!doctype html>
<html lang="__LANG__" dir="__DIR__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="generator" content="Venture OS Phase 3 MVP builder">
<style>
  :root { --ink:#1c2321; --quiet:#5b6661; --line:#dce1da; --accent:#0f766e; --soft:#e3f1ee; --warn:#b45309; --bg:#f7f8f6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--accent); color:#fff; padding:16px; }
  header h1 { margin:0; font-size:1.3rem; } header p { margin:4px 0 0; opacity:.9; }
  .banner { background:#fdf1e1; color:var(--warn); padding:8px 16px; font-size:.85rem; border-bottom:1px solid #f3d9b1; }
  nav { display:flex; gap:6px; flex-wrap:wrap; padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); }
  nav button { border:1px solid var(--line); background:#fff; padding:8px 12px; border-radius:8px; cursor:pointer; font:inherit; }
  nav button.on { background:var(--soft); border-color:var(--accent); color:var(--accent); font-weight:600; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  section { display:none; } section.on { display:block; }
  .help { color:var(--quiet); margin:0 0 12px; }
  form, .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:.9rem; margin:8px 0 4px; }
  input, select, textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  input[type=checkbox] { width:auto; }
  button.primary { margin-top:12px; background:var(--accent); color:#fff; border:0; padding:10px 16px; border-radius:8px; font:inherit; cursor:pointer; }
  button.small { border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .muted { color:var(--quiet); font-size:.85rem; } .low { color:#b42318; font-weight:600; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; } .stat { flex:1 1 140px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; }
  .stat b { display:block; font-size:1.6rem; } .result { font-size:1.4rem; font-weight:700; margin-top:10px; }
  footer { color:var(--quiet); font-size:.75rem; text-align:center; padding:20px; }
</style>
</head>
<body>
<header><h1 id="title"></h1><p id="tagline"></p></header>
<div class="banner" id="banner" data-testid="mvp-banner"></div>
<nav id="nav"></nav>
<main id="main"></main>
<footer id="footer"></footer>
<script type="application/json" id="config">__CONFIG_JSON__</script>
<script>
"use strict";
// Venture OS MVP. Everything stays on this device (localStorage). No network calls, no real payments.
const C = JSON.parse(document.getElementById("config").textContent);
const T = C.texts;
const KEY = "mvp_" + C.brief_id + "_";
const load = (k) => { try { return JSON.parse(localStorage.getItem(KEY + k) || "[]"); } catch (e) { return []; } };
const save = (k, v) => { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) { /* storage off */ } };
const el = (tag, attrs, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) n.append(k instanceof Node ? k : document.createTextNode(String(k ?? "")));
  return n;
};
const nums = C.fields.filter(f => f.type === "number");
const minField = nums.find(f => /min|حد|أدنى|ادنى/i.test(f.label));
const qtyField = nums.find(f => f !== minField);

document.getElementById("title").textContent = C.title;
document.getElementById("tagline").textContent = C.tagline;
document.getElementById("banner").textContent = T.banner;
document.getElementById("footer").textContent = T.footer + " · Brief " + C.brief_id + " v" + C.brief_version;

function fieldInput(f, prefix) {
  const id = prefix + f.id;
  let input;
  if (f.type === "select") input = el("select", {id, name: f.id}, el("option", {value: ""}, "—"), f.options.map(o => el("option", {value: o}, o)));
  else if (f.type === "textarea") input = el("textarea", {id, name: f.id, rows: "3"});
  else if (f.type === "checkbox") input = el("input", {id, name: f.id, type: "checkbox"});
  else input = el("input", {id, name: f.id, type: f.type === "number" ? "number" : f.type, step: f.type === "number" ? "any" : null});
  if (f.required && f.type !== "checkbox") input.required = true;
  return [el("label", {for: id}, f.label + (f.required ? " *" : "") + (f.mocked ? " (MOCKED)" : "")), input];
}

function readForm(form, fields) {
  const rec = {};
  for (const f of fields) {
    const i = form.elements[f.id];
    rec[f.id] = f.type === "checkbox" ? i.checked : i.value;
  }
  return rec;
}

function describe(rec, fields) {
  return fields.filter(f => rec[f.id] !== "" && rec[f.id] !== false && rec[f.id] !== undefined)
    .map(f => f.label + ": " + (rec[f.id] === true ? "✓" : rec[f.id])).join(" · ");
}

function listCard(k, rec, fields, onRemove, extra) {
  return el("div", {class: "card row", "data-record": ""},
    el("div", {}, el("div", {}, describe(rec, fields)), el("div", {class: "muted"}, rec._at || ""), extra || ""),
    el("button", {class: "small", type: "button", on: {click: onRemove}}, T.remove));
}

const providerFields = [
  {id: "p1", label: T.provider_name, type: "text", required: true},
  {id: "p2", label: T.provider_offer, type: "text", required: true},
  {id: "p3", label: T.provider_area, type: "text", required: false},
];

const SCREENS = {
  add(sec) {
    const fields = C.fields.slice();
    const providers = load("providers");
    if (C.template === "booking") fields.unshift({id: "_provider", label: T.provider_pick, type: "select", required: false,
      options: providers.map(p => p.p1 + " — " + p.p2)});
    const form = el("form", {"data-requirements": (C.screen_requirements.add || []).join(" ")},
      fields.map(f => fieldInput(f, "a_")), el("button", {class: "primary", type: "submit"}, T.save));
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const rec = readForm(form, fields); rec._at = new Date().toLocaleString();
      const items = load("items"); items.push(rec); save("items", items);
      form.reset(); show(C.template === "calculator" ? "home" : "list");
    });
    sec.append(form);
  },
  list(sec) {
    if (C.template === "calculator") return SCREENS.saved(sec);
    const items = load("items");
    const fields = C.template === "booking" ? [{id: "_provider", label: T.provider_pick}].concat(C.fields) : C.fields;
    if (!items.length) sec.append(el("p", {class: "muted"}, T.empty));
    items.forEach((rec, i) => sec.append(listCard("items", rec, fields, () => { items.splice(i, 1); save("items", items); show("list"); })));
  },
  saved(sec) {
    const items = load("results");
    if (!items.length) sec.append(el("p", {class: "muted"}, T.empty));
    items.forEach((rec, i) => sec.append(listCard("results", rec, C.fields, () => { items.splice(i, 1); save("results", items); show("list"); },
      el("div", {class: "result"}, T.result + ": " + rec._result))));
  },
  providers(sec) {
    const form = el("form", {"data-requirements": (C.screen_requirements.providers || []).join(" ")},
      el("p", {class: "help"}, T.provider_help), providerFields.map(f => fieldInput(f, "p_")),
      el("button", {class: "primary", type: "submit"}, T.provider_join));
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const rec = readForm(form, providerFields); rec._at = new Date().toLocaleString();
      const ps = load("providers"); ps.push(rec); save("providers", ps); show("providers");
    });
    sec.append(form);
    const ps = load("providers");
    if (!ps.length) sec.append(el("p", {class: "muted"}, T.no_providers));
    ps.forEach((rec, i) => sec.append(listCard("providers", rec, providerFields, () => { ps.splice(i, 1); save("providers", ps); show("providers"); })));
  },
  feedback(sec) {
    const form = el("form", {"data-requirements": (C.screen_requirements.feedback || []).join(" ")},
      el("label", {for: "fb"}, T.feedback_label), el("textarea", {id: "fb", name: "fb", rows: "4", required: ""}),
      el("p", {class: "muted"}, T.feedback_note), el("button", {class: "primary", type: "submit"}, T.send));
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const fb = load("feedback"); fb.push({text: form.elements.fb.value, _at: new Date().toLocaleString()});
      save("feedback", fb); form.reset(); show("feedback");
    });
    sec.append(form);
    load("feedback").forEach(f => sec.append(el("div", {class: "card"}, el("div", {}, f.text), el("div", {class: "muted"}, f._at))));
  },
  home(sec) {
    const req = (C.screen_requirements.home || []).join(" ");
    const items = load("items");
    if (C.template === "calculator") {
      const form = el("form", {"data-requirements": req}, C.fields.map(f => fieldInput(f, "c_")),
        el("div", {class: "result", id: "calc-result"}, T.result + ": —"),
        el("p", {class: "muted"}, T.formula), el("button", {class: "primary", type: "submit"}, T.save));
      const compute = () => {
        const vals = nums.map(f => parseFloat(form.elements[f.id].value)).filter(v => !isNaN(v));
        return vals.length ? vals.reduce((a, b) => a * b, 1) : null;
      };
      form.addEventListener("input", () => { const r = compute(); form.querySelector("#calc-result").textContent = T.result + ": " + (r === null ? "—" : r.toLocaleString()); });
      form.addEventListener("submit", (e) => {
        e.preventDefault(); const r = compute(); if (r === null) return;
        const rec = readForm(form, C.fields); rec._result = r.toLocaleString(); rec._at = new Date().toLocaleString();
        const rs = load("results"); rs.push(rec); save("results", rs); show("list");
      });
      return sec.append(form);
    }
    if (C.template === "tracker") {
      const low = items.filter(r => qtyField && minField && r[minField.id] !== "" && parseFloat(r[qtyField.id]) < parseFloat(r[minField.id]));
      sec.append(el("div", {class: "stats", "data-requirements": req},
        el("div", {class: "stat"}, el("b", {}, items.length), T.records),
        el("div", {class: "stat"}, el("b", {class: low.length ? "low" : ""}, low.length), T.below_min)));
      low.forEach(r => sec.append(el("div", {class: "card low"}, describe(r, C.fields))));
      return;
    }
    if (C.template === "booking") {
      const ps = load("providers");
      sec.append(el("div", {"data-requirements": req}));
      if (!ps.length) sec.append(el("p", {class: "muted"}, T.no_providers));
      ps.forEach(p => sec.append(el("div", {class: "card"}, el("b", {}, p.p1), el("div", {}, p.p2), el("div", {class: "muted"}, p.p3 || ""))));
      return;
    }
    // directory / library: search across everything users added
    const q = el("input", {type: "search", placeholder: T.search, "aria-label": T.search, "data-requirements": req});
    const box = el("div");
    const draw = () => {
      box.replaceChildren();
      const term = q.value.trim().toLowerCase();
      const hits = items.filter(r => !term || describe(r, C.fields).toLowerCase().includes(term));
      if (!hits.length) box.append(el("p", {class: "muted"}, T.empty));
      hits.forEach(r => box.append(el("div", {class: "card"}, describe(r, C.fields))));
    };
    q.addEventListener("input", draw); sec.append(q, box); draw();
  },
};

const nav = document.getElementById("nav"), main = document.getElementById("main");
function show(id) {
  main.replaceChildren();
  const sec = el("section", {class: "on", id: "screen-" + id, "data-screen": id});
  if (T.help && T.help[id]) sec.append(el("p", {class: "help"}, T.help[id]));
  (SCREENS[id] || SCREENS.list)(sec);
  main.append(sec);
  nav.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.screen === id));
}
for (const [id, name] of Object.entries(C.screens)) nav.append(el("button", {type: "button", "data-screen": id, on: {click: () => show(id)}}, name));
show(Object.keys(C.screens)[0]);
</script>
</body>
