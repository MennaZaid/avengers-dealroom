name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: replay   # CI never calls live models or the web, and gets no secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/dev.py setup
      - run: python scripts/dev.py lint
      - name: Tests
        run: python -m pytest -q --junitxml=results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.sha }}
          path: results/
