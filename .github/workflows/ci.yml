name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: venture
          POSTGRES_PASSWORD: venture   # throwaway CI database, not a secret
          POSTGRES_DB: venture_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U venture -d venture_os"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      LLM_MODE: replay   # CI never calls live models or the web, and gets no secrets
      DATABASE_URL: postgresql://venture:venture@localhost:5432/venture_os
      PGPASSWORD: venture
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Compose file is valid
        run: docker compose config --quiet
      - run: python scripts/dev.py setup
      - name: Lint
        run: python scripts/dev.py lint
      - name: Seed database (schema + registry)
        run: python db/seed.py
      - name: Tests (unit, smoke, integration)
        run: python -m pytest -q -rs --junitxml=results/junit.xml
      - name: Registry role checks (tests/sql/registry_roles.sql)
        run: |
          mkdir -p results && psql -h localhost -U venture -d venture_os < tests/sql/registry_roles.sql > results/registry_roles.txt 2>&1
          cat results/registry_roles.txt
          count() { grep -c "$1" results/registry_roles.txt || true; }
          test "$(count '^ERROR:  new row violates row-level security')" -eq 3
          test "$(count '^ERROR:  permission denied')" -eq 3
          test "$(count '^INSERT 0 1')" -eq 2
          test "$(count '^UPDATE 1')" -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: results-${{ github.sha }}
          path: results/
