[project]
name = "venture-os"
version = "0.1.0"
description = "Open-source, founder-controlled, evidence-backed multi-agent venture-building system"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
ui = ["streamlit>=1.36"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/venture_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
